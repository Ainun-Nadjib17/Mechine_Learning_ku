{% extends "layout.html" %}

{% block title %}Kontak{% endblock %}

{% block content %}
<section class="page-header">
    <div class="container">
        <h1>Kontak</h1>
        <p class="lead">Hubungi pengembang TomatAI</p>
    </div>
</section>

<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="contact-card">
                    <div class="contact-avatar">👨‍💻</div>
                    <h3>Pengembang</h3>
                    <p class="text-muted">TomatAI Developer</p>

                    <div class="contact-links">
                        <a href="mailto:developer@example.com" class="contact-link">
                            <span class="contact-icon">📧</span>
                            <span>developer@example.com</span>
                        </a>
                        <a href="https://github.com/" class="contact-link" target="_blank">
                            <span class="contact-icon">🐙</span>
                            <span>GitHub</span>
                        </a>
                        <a href="https://linkedin.com/" class="contact-link" target="_blank">
                            <span class="contact-icon">💼</span>
                            <span>LinkedIn</span>
                        </a>
                    </div>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="contact-form-card">
                    <h4>Kirim Pesan</h4>
                    <form>
                        <div class="mb-3">
                            <label class="form-label">Nama</label>
                            <input type="text" class="form-control" placeholder="Nama Anda">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" placeholder="email@contoh.com">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Pesan</label>
                            <textarea class="form-control" rows="4" placeholder="Tuliskan pesan Anda..."></textarea>
                        </div>
                        <button type="button" class="btn btn-accent w-100">Kirim Pesan</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
