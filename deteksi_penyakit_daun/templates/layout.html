<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AgroScan{% endblock %} - Deteksi Penyakit Daun Tomat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/agroscan_brand_logo.png') }}">
</head>
<body>

    <!-- Grid Overlay -->
    <div class="grid-overlay"></div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg fixed-top glass-nav">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center fw-bold" href="/">
                <img src="{{ url_for('static', filename='images/agroscan_brand_logo.png') }}" alt="AgroScan" class="brand-logo me-2">
                AgroScan
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">Beranda</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/tentang' %}active{% endif %}" href="/tentang">Tentang</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/deteksi' %}active{% endif %}" href="/deteksi">Deteksi</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path.startswith('/penyakit') %}active{% endif %}" href="/penyakit">Penyakit</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/kontak' %}active{% endif %}" href="/kontak">Kontak</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Content -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6 text-center text-md-start mb-3 mb-md-0">
                    <strong style="color: white;">AgroScan</strong>
                    <span style="opacity: 0.7; margin-left: 0.5rem;">Sistem Deteksi Penyakit Daun Tomat Berbasis AI</span>
                </div>
                <div class="col-md-6 text-center text-md-end">
                    <span style="opacity: 0.6; font-size: 0.875rem;">&copy; 2026 AgroScan. All rights reserved.</span>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
